<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yu Su — Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/tour.css" />
</head>
<body>

  <section class="tour">

    <h2 class="tour-title">TOUR DATES</h2>

    <div class="tour-list" id="tour-list">
      <div class="tour-loading" id="tour-loading">
        <div class="tour-spinner"></div>
        Chargement des dates…
      </div>
    </div>

  </section>

  <script type="module">
    import { onSnapshotTourDates } from './firebase.js';

    const list    = document.getElementById('tour-list');
    const loading = document.getElementById('tour-loading');

    function formatDate(str) {
      if (!str) return '—';
      const [y, m, d] = str.split('-');
      return `${d}/${m}`;
    }

    function renderDates(dates) {
      list.querySelectorAll('.tour-row').forEach(r => r.remove());
      loading.style.display = 'none';

      if (!dates.length) {
        list.innerHTML = `<div class="tour-empty">Aucune date annoncée pour le moment.</div>`;
        return;
      }

      dates.forEach((d) => {
        const row = document.createElement('div');
        row.className = 'tour-row';
        row.innerHTML = `
          <div class="tour-info">
            <p class="tour-event">${esc(d.event || '—')}</p>
            <p class="tour-album">${esc(d.lieu || '')}</p>
          </div>
          <p class="tour-date">${formatDate(d.date)}</p>
          <p class="tour-city">${esc(d.ville || '—')}, ${esc(d.pays || '—')}</p>
          ${d.soldout
            ? `<span class="tour-btn soldout">COMPLET</span>`
            : `<a class="tour-btn" href="${esc(d.tickets || '#')}" target="_blank">TICKETS</a>`
          }
        `;
        list.appendChild(row);
      });
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    onSnapshotTourDates(
      (dates) => renderDates(dates),
      (err)   => {
        console.error(err);
        loading.textContent = 'Erreur de chargement.';
      }
    );
  </script>

</body>
</html>
